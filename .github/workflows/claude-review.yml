name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  # A new push cancels a review still running for the same pull request.
  # Label changes only re-check the gate, so they wait instead of cancelling.
  cancel-in-progress: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

jobs:
  review:
    uses: zuarbase/claude-review/.github/workflows/review.yml@v1
    secrets: inherit
    with:
      # portal-client-mcp's own Bedrock application inference profile.
      model_arn: arn:aws:bedrock:us-east-1:575296055612:application-inference-profile/bx0ly46o5g12
